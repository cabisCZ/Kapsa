<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#040820">
<link rel="apple-touch-icon" href="/icon.png">
<title>Napovídač – ovladač</title>
<style>
  :root { --me: #5b8cff; --me2: #2a5cff; --glow: #e9e4ff; --other: #f29be0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: linear-gradient(180deg, rgba(3,6,26,.9), rgba(3,6,26,.55)), url(/brand/waves.jpg) center bottom / cover no-repeat, #040820; }
  html, body { margin: 0; height: 100%; color: #f3f3f5; font-family: -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px); gap: 14px; user-select: none; -webkit-user-select: none; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top b { font-size: 17px; display: flex; align-items: center; gap: 10px; }
  .top b img { width: 34px; height: 28px; padding: 6px 8px; border-radius: 9px; background: linear-gradient(160deg, rgba(90,130,255,.8), rgba(36,76,230,.65)); box-shadow: inset 0 0 0 1px rgba(200,215,255,.5); }
  .chip { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; background: rgba(16,28,84,.6); font-size: 13px; color: #d4dcff; backdrop-filter: blur(10px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .speaking .dot { background: var(--me); box-shadow: 0 0 8px var(--me); }
  .other .dot { background: var(--other); box-shadow: 0 0 8px var(--other); }
  .off .dot { background: #ff4d4d; }
  .beam { height: 4px; border-radius: 4px; background: rgba(150,180,255,.15); overflow: hidden; }
  .beam i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--me2), var(--me), var(--glow)); transition: width .1s; }
  .prog { height: 3px; border-radius: 3px; background: rgba(150,180,255,.15); } .prog i { display: block; height: 100%; width: 0; background: #a9c1ff; border-radius: 3px; }
  .play { flex: none; height: 34vh; max-height: 260px; border: 0; border-radius: 28px; background: linear-gradient(160deg, #6f9bff, var(--me2)); box-shadow: inset 0 0 0 1px rgba(200,215,255,.45), 0 10px 40px rgba(42,92,255,.45); color: #fff; font-size: 22px; font-weight: 800; display: grid; place-items: center; }
  .play.on { background: rgba(16,28,84,.7); box-shadow: inset 0 0 0 1px rgba(150,180,255,.25); }
  .play:active { transform: scale(.98); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid button { height: 62px; border: 0; border-radius: 18px; background: rgba(16,28,84,.6); box-shadow: inset 0 0 0 1px rgba(150,180,255,.14); backdrop-filter: blur(10px); color: #fff; font-size: 15px; font-weight: 600; }
  .grid button:active { background: rgba(40,64,170,.6); }
  .speed { grid-column: span 2; display: grid; place-items: center; font-size: 13px; color: #93a2d6; }
  .speed b { font-size: 22px; color: #fff; }
  .pad { flex: 1; min-height: 90px; border-radius: 18px; background: rgba(10,18,60,.45); box-shadow: inset 0 0 0 1px rgba(150,180,255,.12); display: grid; place-items: center; color: #6f7fb8; font-size: 13px; touch-action: none; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; overflow-x: auto; flex: none; }
  ol li { flex: none; padding: 10px 14px; border-radius: 14px; background: rgba(16,28,84,.6); font-size: 14px; white-space: nowrap; }
  ol li.on { background: rgba(91,140,255,.45); color: #fff; }
</style>
</head>
<body>
  <div class="top"><b><img src="/brand/logo.svg" alt="">Napovídač</b><div class="chip" id="chip"><span class="dot"></span><span id="st">Připojuji…</span></div></div>
  <div class="beam"><i id="lvl"></i></div>
  <button class="play" id="play">Spustit</button>
  <div class="grid">
    <button data-c="prevCue">‹ Sekce</button>
    <div class="speed"><span>Rychlost</span><b id="spd">–</b></div>
    <button data-c="nextCue">Sekce ›</button>
    <button data-c="restart">⟲</button>
    <button data-c="speedDown">−</button>
    <button data-c="speedUp">+</button>
    <button data-c="toggleVisible">👁</button>
  </div>
  <ol id="cues"></ol>
  <div class="pad" id="pad">Táhněte prstem pro ruční posun</div>
  <div class="prog"><i id="prog"></i></div>
<script>
  const send = (type, extra) => fetch('/cmd', { method: 'POST', body: JSON.stringify(Object.assign({ type }, extra || {})) }).catch(() => {});
  document.getElementById('play').onclick = () => send('togglePlay');
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => send(b.dataset.c));
  document.getElementById('cues').onclick = e => { const li = e.target.closest('li'); if (li) send('jumpCue', { index: +li.dataset.i }); };
  let lastY = null, acc = 0, tm = null;
  const pad = document.getElementById('pad');
  pad.addEventListener('pointerdown', e => { lastY = e.clientY; pad.setPointerCapture(e.pointerId); });
  pad.addEventListener('pointermove', e => {
    if (lastY === null) return;
    acc += (lastY - e.clientY) * 1.6; lastY = e.clientY;
    if (!tm) tm = setTimeout(() => { send('nudge', { delta: acc }); acc = 0; tm = null; }, 40);
  });
  pad.addEventListener('pointerup', () => { lastY = null; });
  let cuesKey = '';
  function connect() {
    const es = new EventSource('/events');
    es.onmessage = ev => {
      const s = JSON.parse(ev.data);
      const chip = document.getElementById('chip');
      chip.className = 'chip' + (s.speaking && s.playing ? ' speaking' : s.other ? ' other' : '');
      document.getElementById('st').textContent = !s.playing ? 'Pauza' : s.mode !== 'voice' ? 'Běží' : s.speaking ? 'Mluvíte' : s.other ? 'Mluví druhá strana' : 'Čekám na hlas';
      const p = document.getElementById('play');
      p.textContent = s.playing ? 'Pauza' : 'Spustit'; p.classList.toggle('on', !!s.playing);
      document.getElementById('spd').textContent = s.speed;
      document.getElementById('lvl').style.width = Math.round((s.level || 0) * 100) + '%';
      document.getElementById('prog').style.width = Math.round((s.progress || 0) * 100) + '%';
      const key = (s.cues || []).join('\u0001');
      const ol = document.getElementById('cues');
      if (key !== cuesKey) { cuesKey = key; ol.innerHTML = (s.cues || []).map((c, i) => '<li data-i="' + i + '"></li>').join(''); [...ol.children].forEach((li, i) => li.textContent = s.cues[i]); }
      [...ol.children].forEach((li, i) => li.classList.toggle('on', i === s.cue));
    };
    es.onerror = () => { document.getElementById('st').textContent = 'Odpojeno'; document.getElementById('chip').className = 'chip off'; es.close(); setTimeout(connect, 1500); };
  }
  connect();
</script>
</body>
</html>
